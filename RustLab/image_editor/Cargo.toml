[package]
name = "image_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
image = "0.25"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"