[package]
name = "web_downloader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web-downloader"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
futures = "0.3"